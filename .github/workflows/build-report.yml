name: Build report PDF

on:
  push:
    branches: [main]
    paths-ignore:
      - 'report/main.pdf'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XeLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-latex-extra texlive-lang-other fonts-dejavu

      - name: Build report
        working-directory: report
        run: |
          set -e
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
          pdfinfo main.pdf | grep '^Pages:' || true

      - name: Commit rebuilt PDF
        run: |
          if git diff --quiet -- report/main.pdf; then
            echo 'PDF is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add report/main.pdf
          git commit -m 'report: rebuild PDF with experiment 14'
          git push
