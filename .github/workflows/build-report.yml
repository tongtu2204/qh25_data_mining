name: Build report PDF

on:
  push:
    branches: [main]
    paths-ignore:
      - 'report/main.pdf'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XeLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-latex-extra texlive-lang-other fonts-dejavu poppler-utils

      - name: Build report
        working-directory: report
        run: |
          set -e
          # A row that begins literally with [21] can be parsed by TeX as an
          # optional row-spacing argument. Group it so the displayed text stays [21].
          sed -i 's/^\[21\] \& 0,85/{[21]} \& 0,85/' De_xuat.tex
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
          pdfinfo main.pdf | grep '^Pages:'
          pdftotext main.pdf report_text.txt
          grep -q 'Balanced Random Forest' report_text.txt
          grep -q 'LightGBM' report_text.txt
          pages=$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')
          pdftoppm -f "$pages" -singlefile -png -r 72 main.pdf /tmp/report_last >/dev/null 2>&1
          test -s /tmp/report_last.png
          rm report_text.txt

      - name: Commit rebuilt PDF
        run: |
          git checkout -- report/De_xuat.tex
          if git diff --quiet -- report/main.pdf; then
            echo 'PDF is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add report/main.pdf
          git commit -m 'report: rebuild PDF with experiment 14'
          git push
